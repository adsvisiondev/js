name: Update SSTP Servers

on:
  # اجرای دستی از تب Actions
  workflow_dispatch:

  # اجرای خودکار هر 6 ساعت
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-sstp-servers
  cancel-in-progress: false

jobs:
  update:
    name: Download, convert and encrypt SSTP servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate encrypted servers file
        run: node tools/update-servers.mjs

      - name: Validate generated output
        shell: bash
        run: |
          if [ ! -s "servers.enc" ]; then
            echo "servers.enc was not generated or is empty."
            exit 1
          fi

          echo "servers.enc size:"
          wc -c servers.enc

      - name: Commit updated servers.enc
        shell: bash
        run: |
          if git diff --quiet -- servers.enc; then
            echo "No changes detected in servers.enc."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add servers.enc
          git commit -m "Update encrypted SSTP servers"
          git push origin HEAD:main
